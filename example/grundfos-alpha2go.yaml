# Beispiel: Grundfos ALPHA2 GO ueber BLE -> ESPHome (lesend)
substitutions:
  name: grundfos-pumpe
  pump_mac: "AA:BB:CC:DD:EE:FF"   # MAC der Pumpe (Name im Scan: "ALPHA2 GO")

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    grundfos_alpha2go: DEBUG    # VERBOSE zeigt zusaetzlich die Felder @24/28/32 (m3/h, m, kv)

api:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: ../components     # oder: github://<user>/<repo>@main mit "components: [grundfos_alpha2go]"

esp32_ble_tracker:

ble_client:
  - mac_address: ${pump_mac}
    id: pumpe

sensor:
  - platform: grundfos_alpha2go
    ble_client_id: pumpe
    update_interval: 10s
    flow:
      name: "Pumpe Durchfluss"
    head:
      name: "Pumpe Foerderhoehe"
    power:
      id: pumpe_leistung
      name: "Pumpe Leistung"
    voltage:
      name: "Pumpe Netzspannung"
    dc_voltage:
      name: "Pumpe Zwischenkreisspannung"
    current:
      name: "Pumpe Strom"
    speed:
      name: "Pumpe Drehzahl"
    aux_temperature:
      name: "Pumpe Elektroniktemperatur"
    starts:
      name: "Pumpe Starts"
    operating_hours:
      name: "Pumpe Betriebsstunden"
    power_on_hours:
      name: "Pumpe Einschaltstunden"
    # Ungetestet auf der ALPHA2 GO (Objekt 93/300, evtl. NaN):
    # media_temperature:
    #   name: "Pumpe Medientemperatur"
    # pcb_temperature:
    #   name: "Pumpe Platinentemperatur"

  - platform: integration     # kWh aus der Leistung (die Pumpe liefert keinen eigenen Zaehler in diesen Objekten)
    name: "Pumpe Energie"
    sensor: pumpe_leistung
    time_unit: h
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.001
