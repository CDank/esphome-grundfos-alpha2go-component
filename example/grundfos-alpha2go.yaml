# Example: Grundfos ALPHA2 GO over BLE -> ESPHome (all sensors and controls)
substitutions:
  name: grundfos-pump
  pump_mac: "AA:BB:CC:DD:EE:FF"   # pump MAC (shows up as "ALPHA2 GO" in a scan)

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    grundfos_alpha2go: DEBUG    # VERBOSE also logs every raw field of each reply

api:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://CDank/esphome-grundfos-alpha2go-component@main
    components: [grundfos_alpha2go]

esp32_ble_tracker:

ble_client:
  - mac_address: ${pump_mac}
    id: pump_ble

# Numeric, binary and text sensors all go into this one block
sensor:
  - platform: grundfos_alpha2go
    id: pump
    ble_client_id: pump_ble
    language: en                # texts and select options in English (default: de)
    update_interval: 10s
    flow:
      name: "Pump flow"
    head:
      name: "Pump head"
    power:
      name: "Pump power"
    voltage:
      name: "Pump mains voltage"
    dc_voltage:
      name: "Pump DC link voltage"
    current:
      name: "Pump current"
    speed:
      name: "Pump speed"
    aux_temperature:
      name: "Pump electronics temperature"
    starts:
      name: "Pump starts"
    operating_hours:
      name: "Pump operating hours"
    power_on_hours:
      name: "Pump power-on hours"
    media_temperature:
      name: "Pump media temperature"
    pcb_temperature:
      name: "Pump PCB temperature"
    controlbox_temperature:
      name: "Pump control box temperature"
    energy:                     # the pump's own counter, same as in the app
      name: "Pump energy"
    operation_mode_text:        # numeric codes: operation_mode / control_mode
      name: "Pump operation mode"
    control_mode_text:
      name: "Pump control mode"
    # Only the setpoint matching the active control mode has a value
    setpoint_head:
      name: "Pump setpoint head"
    setpoint_flow:
      name: "Pump setpoint flow"
    setpoint_speed:
      name: "Pump setpoint speed"
    setpoint_actual:
      name: "Pump current target"
    night_setback_enabled:
      name: "Pump night setback enabled"
    night_mode:
      name: "Pump night mode"
    air_detection_enabled:
      name: "Pump air detection enabled"
    air_detections:
      name: "Pump air detections"
    venting_active:
      name: "Pump venting active"
    venting_status:
      name: "Pump venting status"
    connected:
      name: "Pump connected"

# Controls (write to the pump; the state is always read back)
switch:
  - platform: grundfos_alpha2go
    pump:
      name: "Pump"
    night_setback:
      name: "Pump night setback"
    air_detection:
      name: "Pump air detection"

select:
  - platform: grundfos_alpha2go
    control_mode:
      name: "Pump control mode select"

number:
  - platform: grundfos_alpha2go
    setpoint_head:              # proportional / constant pressure
      name: "Pump setpoint head"
      mode: box
    setpoint_flow:              # constant flow
      name: "Pump setpoint flow"
    setpoint_speed:             # constant speed
      name: "Pump setpoint speed"

button:
  - platform: grundfos_alpha2go
    venting_start:
      name: "Pump system venting start"
    venting_stop:
      name: "Pump system venting stop"
