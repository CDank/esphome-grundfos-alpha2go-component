# Beispiel: Grundfos ALPHA2 GO ueber BLE -> ESPHome (lesend)
substitutions:
  name: grundfos-pumpe
  pump_mac: "AA:BB:CC:DD:EE:FF"   # MAC der Pumpe (Name im Scan: "ALPHA2 GO")

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    grundfos_alpha2go: DEBUG    # VERBOSE zeigt zusaetzlich alle Rohfelder jeder Antwort

api:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://CDank/esphome-grundfos-alpha2go-component@main
    components: [grundfos_alpha2go]
  # lokal stattdessen:
  # - source:
  #     type: local
  #     path: ../components

esp32_ble_tracker:

ble_client:
  - mac_address: ${pump_mac}
    id: pumpe

sensor:
  - platform: grundfos_alpha2go
    ble_client_id: pumpe
    update_interval: 10s
    flow:
      name: "Pumpe Durchfluss"
    head:
      name: "Pumpe Foerderhoehe"
    power:
      id: pumpe_leistung
      name: "Pumpe Leistung"
    voltage:
      name: "Pumpe Netzspannung"
    dc_voltage:
      name: "Pumpe Zwischenkreisspannung"
    current:
      name: "Pumpe Strom"
    speed:
      name: "Pumpe Drehzahl"
    aux_temperature:
      name: "Pumpe Elektroniktemperatur"
    starts:
      name: "Pumpe Starts"
    operating_hours:
      name: "Pumpe Betriebsstunden"
    power_on_hours:
      name: "Pumpe Einschaltstunden"
    media_temperature:
      name: "Pumpe Medientemperatur"
    pcb_temperature:
      name: "Pumpe Platinentemperatur"
    controlbox_temperature:
      name: "Pumpe Controlbox-Temperatur"
    energy:                     # Zaehler der Pumpe (wie "Kumulierte Leistungsaufnahme" in der App)
      name: "Pumpe Energie"
    # Betriebsart/Regelart als Klartext (Zahlencodes: operation_mode / control_mode, siehe README)
    operation_mode_text:
      name: "Pumpe Betriebsart"
    control_mode_text:
      name: "Pumpe Regelart"
    # Sollwert: je nach Regelart in m, m3/h oder 1/min, die anderen Sensoren sind dann "unbekannt"
    setpoint_head:
      name: "Pumpe Sollwert Förderhöhe"
    setpoint_flow:
      name: "Pumpe Sollwert Durchfluss"
    setpoint_speed:
      name: "Pumpe Sollwert Drehzahl"
    setpoint_actual:
      name: "Pumpe Zielwert aktuell"
    # Einstellungen und Status
    night_setback_enabled:
      name: "Pumpe Nachtabsenkung aktiviert"
    night_mode:
      name: "Pumpe Nachtbetrieb"
    air_detection_enabled:
      name: "Pumpe Lufterkennung aktiviert"
    air_detections:
      name: "Pumpe Lufterkennungen"
    venting_active:
      name: "Pumpe Entlüftung aktiv"
    venting_status:
      name: "Pumpe Entlüftung Status"
